<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPM Spotlight - Component Preview</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
      background: #f5f5f5;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      color: #333;
      margin-bottom: 0.5rem;
    }
    
    .description {
      color: #666;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <h1>VPM Spotlight Component</h1>
  <p class="description">Preview of the spotlight component with sample data.</p>
  
  <div id="vpm-spotlight-root" data-github-url="">
    <section class="vpm-spotlight-section">
      <div class="vpm-spotlight-container">
        <h2 class="vpm-spotlight-heading">Spotlight on VPM Original Content</h2>
        <div id="vpm-spotlight-cards" class="vpm-spotlight-cards">
          <!-- Cards will be dynamically inserted here -->
        </div>
      </div>
    </section>
  </div>
  
  <script>
    (function() {
      'use strict';
      
      var root = document.getElementById('vpm-spotlight-root');
      if (!root || root.dataset.initialized === 'true') return;
      root.dataset.initialized = 'true';
      
      // Sample data for preview
      var sampleData = {
        items: [
          {
            id: 'preview-1',
            title: 'Local News Investigation',
            subtitle: 'In-Depth Reporting',
            description: 'An investigative series exploring important local issues affecting our community.',
            picture: 'https://picsum.photos/seed/spotlight-1/400/200',
            link: '#',
            tags: ['high priority', 'news'],
            dateAdded: '2024-01-15T10:00:00Z'
          },
          {
            id: 'preview-2',
            title: 'Community Spotlight',
            subtitle: 'Featured Story',
            description: 'Meet the people making a difference in our community through their dedication and service.',
            picture: 'https://picsum.photos/seed/spotlight-2/400/200',
            link: '#',
            tags: ['high priority', 'community'],
            dateAdded: '2024-01-14T10:00:00Z'
          },
          {
            id: 'preview-3',
            title: 'Educational Program',
            subtitle: 'Learning Series',
            description: 'A new educational series designed to help students and families learn together.',
            picture: 'https://picsum.photos/seed/spotlight-3/400/200',
            link: '#',
            tags: ['high priority', 'education'],
            dateAdded: '2024-01-13T10:00:00Z'
          }
        ]
      };
      
      var MAX_ACTIVE_ITEMS = 3;
      var HIGH_PRIORITY_TAG = 'high priority';
      var contentData = sampleData.items;
      
      function getActiveItems() {
        return contentData
          .filter(function(item) {
            return item.tags && item.tags.includes(HIGH_PRIORITY_TAG);
          })
          .sort(function(a, b) {
            return new Date(b.dateAdded) - new Date(a.dateAdded);
          })
          .slice(0, MAX_ACTIVE_ITEMS);
      }
      
      function renderCards() {
        var container = document.getElementById('vpm-spotlight-cards');
        if (!container) return;
        
        var activeItems = getActiveItems();
        container.innerHTML = '';
        
        if (activeItems.length === 0) {
          container.innerHTML = '<p style="color: var(--vpm-color-text-muted); padding: 2rem;">No content items are currently active.</p>';
          return;
        }
        
        activeItems.forEach(function(item) {
          var card = createCardElement(item);
          container.appendChild(card);
        });
      }
      
      function createCardElement(item) {
        var card = document.createElement('div');
        card.className = 'vpm-spotlight-card';
        card.setAttribute('data-id', item.id);
        
        var link = document.createElement('a');
        link.href = item.link || '#';
        link.className = 'vpm-spotlight-card-link';
        link.setAttribute('aria-label', 'Read more about ' + (item.title || 'content'));
        
        var image = document.createElement('img');
        image.src = item.picture || '';
        image.alt = item.title || 'Content image';
        image.className = 'vpm-spotlight-card-image';
        image.loading = 'lazy';
        
        var content = document.createElement('div');
        content.className = 'vpm-spotlight-card-content';
        
        var title = document.createElement('h3');
        title.className = 'vpm-spotlight-card-title';
        title.textContent = item.title || '';
        
        var subtitle = document.createElement('p');
        subtitle.className = 'vpm-spotlight-card-subtitle';
        subtitle.textContent = item.subtitle || '';
        
        var description = document.createElement('p');
        description.className = 'vpm-spotlight-card-description';
        description.textContent = item.description || '';
        
        content.appendChild(title);
        content.appendChild(subtitle);
        content.appendChild(description);
        
        link.appendChild(image);
        link.appendChild(content);
        card.appendChild(link);
        
        return card;
      }
      
      renderCards();
    })();
  </script>
</body>
</html>
