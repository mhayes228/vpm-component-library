<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Signup - Default</title>
  <style>
    /* Base Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* Component Styles */
    :root {
      /* Colors - VPM Brand */
      --vpm-color-navy-blue: #003865;
      --vpm-color-light-blue: #6CACE4;
      --vpm-color-yellow: #E0E721;
      --vpm-color-red: #EE2737;
      --vpm-color-black: #101820;
      --vpm-color-gray: #B2B4B2;
      
      /* Colors - Generic */
      --vpm-color-primary: #005eb8;
      --vpm-color-primary-dark: #004a94;
      --vpm-color-primary-light: #0066cc;
      --vpm-color-secondary: #2ecc71;
      --vpm-color-secondary-dark: #27ae60;
      --vpm-color-accent: #e74c3c;
      --vpm-color-text: #333333;
      --vpm-color-text-light: #666666;
      --vpm-color-text-muted: #999999;
      --vpm-color-bg: #ffffff;
      --vpm-color-bg-light: #f5f5f5;
      --vpm-color-bg-dark: #1a1a1a;
      --vpm-color-border: #e0e0e0;
      --vpm-color-border-dark: #333333;
      
      /* Spacing */
      --vpm-spacing-xs: 0.25rem;
      --vpm-spacing-sm: 0.5rem;
      --vpm-spacing-unit: 1rem;
      --vpm-spacing-md: 1.5rem;
      --vpm-spacing-lg: 2rem;
      --vpm-spacing-xl: 3rem;
      --vpm-spacing-xxl: 4rem;
      --vpm-spacing-3xl: 5rem;
      --vpm-spacing-4xl: 6rem;
      --vpm-spacing-5xl: 7rem;
      
      /* Typography */
      --vpm-font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --vpm-font-family-heading: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --vpm-font-size-base: 1rem;
      --vpm-font-size-sm: 0.875rem;
      --vpm-font-size-lg: 1.125rem;
      --vpm-font-size-xl: 1.25rem;
      --vpm-font-size-xxl: 1.5rem;
      --vpm-font-size-2xl: 1.875rem;
      --vpm-font-size-3xl: 2.25rem;
      --vpm-font-size-4xl: 3rem;
      --vpm-font-size-5xl: 3.75rem;
      --vpm-font-weight-normal: 400;
      --vpm-font-weight-medium: 500;
      --vpm-font-weight-semibold: 600;
      --vpm-font-weight-bold: 700;
      --vpm-line-height-base: 1.5;
      --vpm-line-height-tight: 1.25;
      --vpm-line-height-relaxed: 1.75;
      
      /* Borders & Radius */
      --vpm-border-width: 1px;
      --vpm-border-radius: 4px;
      --vpm-border-radius-sm: 2px;
      --vpm-border-radius-lg: 8px;
      --vpm-border-radius-xl: 12px;
      --vpm-border-radius-2xl: 16px;
      --vpm-border-radius-3xl: 20px;
      --vpm-border-radius-4xl: 24px;
      --vpm-border-radius-full: 9999px;
      
      /* Shadows */
      --vpm-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --vpm-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --vpm-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --vpm-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --vpm-shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      /* Transitions */
      --vpm-transition-speed: 0.3s;
      --vpm-transition-speed-fast: 0.15s;
      --vpm-transition-speed-slow: 0.5s;
      --vpm-transition-easing: ease-in-out;
      
      /* Z-index scale */
      --vpm-z-base: 1;
      --vpm-z-dropdown: 1000;
      --vpm-z-sticky: 1020;
      --vpm-z-fixed: 1030;
      --vpm-z-modal-backdrop: 1040;
      --vpm-z-modal: 1050;
      --vpm-z-popover: 1060;
      --vpm-z-tooltip: 1070;
      
      /* Breakpoints (for reference, use in media queries) */
      --vpm-breakpoint-sm: 640px;
      --vpm-breakpoint-md: 768px;
      --vpm-breakpoint-lg: 1024px;
      --vpm-breakpoint-xl: 1280px;
      --vpm-breakpoint-2xl: 1536px;
    }
    [data-theme="dark"] {
      --vpm-color-text: #e0e0e0;
      --vpm-color-text-light: #b0b0b0;
      --vpm-color-text-muted: #808080;
      --vpm-color-bg: #1a1a1a;
      --vpm-color-bg-light: #2a2a2a;
      --vpm-color-bg-dark: #0a0a0a;
      --vpm-color-border: #333333;
      --vpm-color-border-dark: #555555;
    }
    [id*="-root"] {
      box-sizing: border-box;
      font-family: var(--vpm-font-family-base);
      font-size: var(--vpm-font-size-base);
      line-height: var(--vpm-line-height-base);
      color: var(--vpm-color-text);
    }
    [id*="-root"] *,
    [id*="-root"] *::before,
    [id*="-root"] *::after {
      box-sizing: inherit;
    }
    .vpm-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    /* Component: Newsletter Signup (vpm-newsletter-*) */
    /* ------------------------------------------------- */
    #vpm-newsletter-signup {
      font-family: var(--vpm-font-family-base);
      box-sizing: border-box;
    }
    
    #vpm-newsletter-signup * {
      box-sizing: inherit;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__header {
      max-width: 100%;
      margin: 0 auto var(--vpm-spacing-lg);
    }
    
    #vpm-newsletter-signup .vpm-newsletter__header img {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
      border-radius: var(--vpm-border-radius-lg);
      margin: 0 auto;
    }
    
    #vpm-newsletter-signup h3 {
      font-size: 22px;
      line-height: 1.4;
      margin: 0 auto var(--vpm-spacing-lg);
      max-width: 100%;
      font-weight: var(--vpm-font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      word-break: break-word;
      hyphens: auto;
      color: var(--vpm-color-text);
    }
    
    #vpm-newsletter-signup h3 .highlight {
      font-style: italic;
      display: inline-block;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__content {
      max-width: 800px;
      margin: 0 auto;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__fields {
      display: flex;
      flex-direction: column;
      gap: var(--vpm-spacing-md);
      margin-bottom: var(--vpm-spacing-md);
    }
    
    #vpm-newsletter-signup .vpm-newsletter__field-group {
      flex: 1;
      min-width: 0;
    }
    
    #vpm-newsletter-signup label {
      display: block;
      margin-bottom: 6px;
      font-weight: var(--vpm-font-weight-semibold);
      font-size: var(--vpm-font-size-sm);
      text-align: left;
      color: var(--vpm-color-text);
    }
    
    #vpm-newsletter-signup input[type="email"] {
      width: 100%;
      padding: 14px var(--vpm-spacing-md);
      font-size: var(--vpm-font-size-base);
      border: 2px solid var(--vpm-color-border);
      border-radius: var(--vpm-border-radius-lg);
      transition: border-color var(--vpm-transition-speed-fast) var(--vpm-transition-easing),
                  box-shadow var(--vpm-transition-speed-fast) var(--vpm-transition-easing);
      height: 52px;
      -webkit-appearance: none;
      appearance: none;
      color: var(--vpm-color-text);
      background: var(--vpm-color-bg);
    }
    
    #vpm-newsletter-signup input[type="email"]:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
      border-color: var(--vpm-color-primary);
    }
    
    #vpm-newsletter-signup input[type="email"]::placeholder {
      color: var(--vpm-color-text-muted);
    }
    
    #vpm-newsletter-signup .vpm-newsletter__submit {
      flex-shrink: 0;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__submit label {
      margin-bottom: 0;
      height: 0;
      overflow: hidden;
    }
    
    #vpm-newsletter-signup input[type="submit"] {
      border: none;
      padding: var(--vpm-spacing-md) var(--vpm-spacing-xl);
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      border-radius: var(--vpm-border-radius-lg);
      cursor: pointer;
      transition: all var(--vpm-transition-speed-fast) var(--vpm-transition-easing);
      width: 100%;
      height: 52px;
      letter-spacing: 0.5px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--vpm-color-primary);
      color: var(--vpm-color-bg);
    }
    
    #vpm-newsletter-signup input[type="submit"]:hover {
      background: var(--vpm-color-primary-dark);
    }
    
    #vpm-newsletter-signup input[type="submit"]:active {
      transform: translateY(0);
    }
    
    #vpm-newsletter-signup input[type="submit"]:focus {
      outline: 3px solid currentColor;
      outline-offset: 2px;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__explore-link {
      margin-top: var(--vpm-spacing-md);
      font-size: 15px;
      text-align: center;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__explore-link a {
      text-decoration: underline;
      font-weight: var(--vpm-font-weight-semibold);
      padding: 5px 10px;
      border-radius: var(--vpm-border-radius);
      transition: all var(--vpm-transition-speed-fast) var(--vpm-transition-easing);
      color: var(--vpm-color-primary);
    }
    
    #vpm-newsletter-signup .vpm-newsletter__explore-link a:focus {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__response {
      margin-top: 15px;
      padding: var(--vpm-spacing-sm);
      border-radius: var(--vpm-border-radius-lg);
      text-align: center;
      font-weight: var(--vpm-font-weight-semibold);
    }
    
    #vpm-newsletter-signup .vpm-newsletter__response--error {
      background-color: #ffebee;
      color: #c62828;
      border: var(--vpm-border-width) solid #ef9a9a;
      display: none;
    }
    
    #vpm-newsletter-signup .vpm-newsletter__response--success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: var(--vpm-border-width) solid #81c784;
      display: none;
    }
    
    @media screen and (max-width: 360px) {
      #vpm-newsletter-signup h3 {
        font-size: 20px;
        margin-bottom: var(--vpm-spacing-lg);
        letter-spacing: 0.2px;
      }
    
      #vpm-newsletter-signup .vpm-newsletter__header img {
        max-width: 240px;
      }
    }
    
    @media screen and (min-width: 600px) and (max-width: 767px) {
      #vpm-newsletter-signup h3 {
        font-size: 24px;
      }
    
      #vpm-newsletter-signup .vpm-newsletter__header {
        max-width: 350px;
      }
    
      #vpm-newsletter-signup .vpm-newsletter__header img {
        max-width: 350px;
      }
    }
    
    @media screen and (min-width: 768px) {
      #vpm-newsletter-signup .vpm-newsletter__header {
        max-width: 400px;
        margin-bottom: var(--vpm-spacing-xl);
      }
    
      #vpm-newsletter-signup .vpm-newsletter__header img {
        max-width: 400px;
      }
    
      #vpm-newsletter-signup h3 {
        font-size: 28px;
        line-height: 1.3;
        margin-bottom: var(--vpm-spacing-xl);
        letter-spacing: 0.5px;
      }
    
      #vpm-newsletter-signup .vpm-newsletter__fields {
        flex-direction: row;
        gap: 15px;
        align-items: flex-end;
        margin-bottom: var(--vpm-spacing-lg);
      }
    
      #vpm-newsletter-signup input[type="email"] {
        height: 54px;
        padding: var(--vpm-spacing-md);
      }
    
      #vpm-newsletter-signup input[type="submit"] {
        width: auto;
        height: 54px;
        padding: var(--vpm-spacing-md) 40px;
        font-size: 18px;
        letter-spacing: 1px;
      }
    
      #vpm-newsletter-signup .vpm-newsletter__explore-link {
        margin-top: var(--vpm-spacing-lg);
        font-size: var(--vpm-font-size-base);
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      #vpm-newsletter-signup * {
        animation: none !important;
        transition: none !important;
      }
    }
    
  </style>
</head>
<body>
<!-- VPM Newsletter Signup Component -->
<!-- Copy this HTML into Brightspot CMS -->

<!-- EDITABLE: Root Container -->
<div id="vpm-newsletter-signup-root">
  <div id="vpm-newsletter-signup">
    <div class="vpm-newsletter__header">
      <!-- EDITABLE: Newsletter Header Image -->
      <!-- Replace src with your newsletter logo URL -->
      <img src="https://assets.vpm.org/42/0a/e860df4a4251b9004653422ee642/vpm-mm-newsletter-header-150x-100.jpg" alt="VPM News Morning Monitor newsletter logo">
    </div>

    <div class="vpm-newsletter__content">
      <!-- EDITABLE: Heading Text -->
      <!-- Replace heading text below -->
      <h3><span class="highlight">Your Morning</span> Starts Here. Stay informed on news you care about.</h3>

      <!-- EDITABLE: MailChimp Form Action URL -->
      <!-- Replace action URL with your MailChimp form action URL -->
      <form action="https://vpm.us3.list-manage.com/subscribe/post?u=6fe41b3055c403be08140ec95&id=26497cf3ad&f_id=0016c9e1f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate>
        <div class="vpm-newsletter__fields">
          <div class="vpm-newsletter__field-group">
            <label for="mce-EMAIL">
              Email Address
              <span aria-hidden="true">*</span>
              <span class="vpm-sr-only">(required)</span>
            </label>
            <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required placeholder="your.email@example.com" aria-required="true" aria-describedby="email-description">
            <span id="email-description" class="vpm-sr-only">Enter your email address to subscribe to the Morning Monitor newsletter</span>
          </div>

          <div class="vpm-newsletter__submit">
            <label class="vpm-sr-only" for="mc-embedded-subscribe">Submit subscription</label>
            <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe">
          </div>
        </div>

        <div hidden>
          <input type="hidden" name="tags" value="1620245,1620261">
        </div>

        <div class="vpm-newsletter__response vpm-newsletter__response--error" id="mce-error-response" role="alert" aria-live="polite"></div>
        <div class="vpm-newsletter__response vpm-newsletter__response--success" id="mce-success-response" role="alert" aria-live="polite"></div>

        <div aria-hidden="true" style="position: absolute; left: -5000px;">
          <input type="text" name="b_6fe41b3055c403be08140ec95_26497cf3ad" tabindex="-1" value="">
        </div>

        <div class="vpm-newsletter__explore-link">
          <a href="https://www.vpm.org/stay-connected-to-what-matters">Explore More Newsletters</a>
        </div>
      </form>
    </div>
  </div>
</div>
  <script>
    
  </script>
</body>
</html>
