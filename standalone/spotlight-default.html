<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight - Default</title>
  <style>
    /* Base Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* Component Styles */
    :root {
      /* Colors - VPM Brand */
      --vpm-color-navy-blue: #003865;
      --vpm-color-light-blue: #6CACE4;
      --vpm-color-yellow: #E0E721;
      --vpm-color-red: #EE2737;
      --vpm-color-black: #101820;
      --vpm-color-gray: #B2B4B2;
      
      /* Colors - Generic */
      --vpm-color-primary: #005eb8;
      --vpm-color-primary-dark: #004a94;
      --vpm-color-primary-light: #0066cc;
      --vpm-color-secondary: #2ecc71;
      --vpm-color-secondary-dark: #27ae60;
      --vpm-color-accent: #e74c3c;
      --vpm-color-text: #333333;
      --vpm-color-text-light: #666666;
      --vpm-color-text-muted: #999999;
      --vpm-color-bg: #ffffff;
      --vpm-color-bg-light: #f5f5f5;
      --vpm-color-bg-dark: #1a1a1a;
      --vpm-color-border: #e0e0e0;
      --vpm-color-border-dark: #333333;
      
      /* Spacing */
      --vpm-spacing-xs: 0.25rem;
      --vpm-spacing-sm: 0.5rem;
      --vpm-spacing-unit: 1rem;
      --vpm-spacing-md: 1.5rem;
      --vpm-spacing-lg: 2rem;
      --vpm-spacing-xl: 3rem;
      --vpm-spacing-xxl: 4rem;
      --vpm-spacing-3xl: 5rem;
      --vpm-spacing-4xl: 6rem;
      --vpm-spacing-5xl: 7rem;
      
      /* Typography */
      --vpm-font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --vpm-font-family-heading: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --vpm-font-size-base: 1rem;
      --vpm-font-size-sm: 0.875rem;
      --vpm-font-size-lg: 1.125rem;
      --vpm-font-size-xl: 1.25rem;
      --vpm-font-size-xxl: 1.5rem;
      --vpm-font-size-2xl: 1.875rem;
      --vpm-font-size-3xl: 2.25rem;
      --vpm-font-size-4xl: 3rem;
      --vpm-font-size-5xl: 3.75rem;
      --vpm-font-weight-normal: 400;
      --vpm-font-weight-medium: 500;
      --vpm-font-weight-semibold: 600;
      --vpm-font-weight-bold: 700;
      --vpm-line-height-base: 1.5;
      --vpm-line-height-tight: 1.25;
      --vpm-line-height-relaxed: 1.75;
      
      /* Borders & Radius */
      --vpm-border-width: 1px;
      --vpm-border-radius: 4px;
      --vpm-border-radius-sm: 2px;
      --vpm-border-radius-lg: 8px;
      --vpm-border-radius-xl: 12px;
      --vpm-border-radius-2xl: 16px;
      --vpm-border-radius-3xl: 20px;
      --vpm-border-radius-4xl: 24px;
      --vpm-border-radius-full: 9999px;
      
      /* Shadows */
      --vpm-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --vpm-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --vpm-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --vpm-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --vpm-shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      /* Transitions */
      --vpm-transition-speed: 0.3s;
      --vpm-transition-speed-fast: 0.15s;
      --vpm-transition-speed-slow: 0.5s;
      --vpm-transition-easing: ease-in-out;
      
      /* Z-index scale */
      --vpm-z-base: 1;
      --vpm-z-dropdown: 1000;
      --vpm-z-sticky: 1020;
      --vpm-z-fixed: 1030;
      --vpm-z-modal-backdrop: 1040;
      --vpm-z-modal: 1050;
      --vpm-z-popover: 1060;
      --vpm-z-tooltip: 1070;
      
      /* Breakpoints (for reference, use in media queries) */
      --vpm-breakpoint-sm: 640px;
      --vpm-breakpoint-md: 768px;
      --vpm-breakpoint-lg: 1024px;
      --vpm-breakpoint-xl: 1280px;
      --vpm-breakpoint-2xl: 1536px;
    }
    [data-theme="dark"] {
      --vpm-color-text: #e0e0e0;
      --vpm-color-text-light: #b0b0b0;
      --vpm-color-text-muted: #808080;
      --vpm-color-bg: #1a1a1a;
      --vpm-color-bg-light: #2a2a2a;
      --vpm-color-bg-dark: #0a0a0a;
      --vpm-color-border: #333333;
      --vpm-color-border-dark: #555555;
    }
    [id*="-root"] {
      box-sizing: border-box;
      font-family: var(--vpm-font-family-base);
      font-size: var(--vpm-font-size-base);
      line-height: var(--vpm-line-height-base);
      color: var(--vpm-color-text);
    }
    [id*="-root"] *,
    [id*="-root"] *::before,
    [id*="-root"] *::after {
      box-sizing: inherit;
    }
    .vpm-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    /* Component: Spotlight (vpm-spotlight-*) */
    /* --------------------------------------- */
    .vpm-spotlight-section {
      background-color: var(--vpm-color-bg-light);
      padding: var(--vpm-spacing-xl) var(--vpm-spacing-md);
      width: 100%;
      box-sizing: border-box;
    }
    
    .vpm-spotlight-container {
      max-width: 1280px;
      margin: 0 auto;
    }
    
    .vpm-spotlight-heading {
      font-size: var(--vpm-font-size-2xl);
      font-weight: var(--vpm-font-weight-bold);
      color: var(--vpm-color-text);
      margin-bottom: var(--vpm-spacing-lg);
      font-family: var(--vpm-font-family-heading);
    }
    
    .vpm-spotlight-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--vpm-spacing-md);
      position: relative;
    }
    
    .vpm-spotlight-card {
      background-color: var(--vpm-color-bg);
      border-radius: var(--vpm-border-radius-lg);
      overflow: hidden;
      box-shadow: var(--vpm-shadow);
      transition: transform var(--vpm-transition-speed) var(--vpm-transition-easing),
                  box-shadow var(--vpm-transition-speed) var(--vpm-transition-easing);
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: translateX(0);
    }
    
    .vpm-spotlight-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--vpm-shadow-md);
    }
    
    .vpm-spotlight-card.slide-out {
      animation: vpm-slideOut 0.5s ease-out forwards;
    }
    
    .vpm-spotlight-card.slide-in {
      animation: vpm-slideIn 0.5s ease-out forwards;
    }
    
    .vpm-spotlight-card.hidden {
      display: none;
    }
    
    .vpm-spotlight-card-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    
    .vpm-spotlight-card-content {
      padding: var(--vpm-spacing-md);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .vpm-spotlight-card-title {
      font-size: var(--vpm-font-size-lg);
      font-weight: var(--vpm-font-weight-bold);
      color: var(--vpm-color-text);
      margin-bottom: var(--vpm-spacing-sm);
      line-height: var(--vpm-line-height-tight);
      font-family: var(--vpm-font-family-heading);
    }
    
    .vpm-spotlight-card-subtitle {
      font-size: var(--vpm-font-size-sm);
      color: var(--vpm-color-text-muted);
      margin-bottom: var(--vpm-spacing-md);
      font-weight: var(--vpm-font-weight-medium);
      font-family: var(--vpm-font-family-base);
    }
    
    .vpm-spotlight-card-description {
      font-size: var(--vpm-font-size-sm);
      color: var(--vpm-color-text-muted);
      line-height: var(--vpm-line-height-base);
      flex: 1;
      font-family: var(--vpm-font-family-base);
    }
    
    .vpm-spotlight-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
      height: 100%;
    }
    
    .vpm-spotlight-card-link:focus-visible {
      outline: 2px solid var(--vpm-color-red);
      outline-offset: 2px;
      border-radius: var(--vpm-border-radius-lg);
    }
    
    @keyframes vpm-slideOut {
      0% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
        transform: translateX(-100%);
      }
    }
    
    @keyframes vpm-slideIn {
      0% {
        opacity: 0;
        transform: translateX(100%);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @media (max-width: 1024px) {
      .vpm-spotlight-cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 768px) {
      .vpm-spotlight-section {
        padding: var(--vpm-spacing-lg) var(--vpm-spacing-unit);
      }
    
      .vpm-spotlight-heading {
        font-size: var(--vpm-font-size-xl);
        margin-bottom: var(--vpm-spacing-md);
      }
    
      .vpm-spotlight-cards {
        grid-template-columns: 1fr;
        gap: var(--vpm-spacing-unit);
      }
    
      .vpm-spotlight-card-image {
        height: 180px;
      }
    }
    
  </style>
</head>
<body>
<!-- VPM Spotlight Component -->
<!-- Copy this HTML into Brightspot CMS -->

<!-- EDITABLE: Root Container Attributes -->
<!-- Replace data-github-url with your GitHub raw JSON URL -->
<div id="vpm-spotlight-root" data-github-url="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/VPM-Spotlight-Homepage/content-queue.json">
  <section class="vpm-spotlight-section">
    <div class="vpm-spotlight-container">
      <!-- EDITABLE: Section Heading -->
      <!-- Replace heading text below -->
      <h2 class="vpm-spotlight-heading">Spotlight on VPM Original Content</h2>
      <div id="vpm-spotlight-cards" class="vpm-spotlight-cards">
        <!-- Cards will be dynamically inserted here -->
      </div>
    </div>
  </section>
</div>
  <script>
    (function() {
      'use strict';
      
      var root = document.getElementById('vpm-spotlight-root');
      if (!root || root.dataset.initialized === 'true') return;
      root.dataset.initialized = 'true';
      
      // EDITABLE: Configuration Variables
      // Modify MAX_ACTIVE_ITEMS to change how many items display (default: 3)
      // Modify HIGH_PRIORITY_TAG to change the tag filter (default: 'high priority')
      var GITHUB_JSON_URL = root.getAttribute('data-github-url') || 'https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/VPM-Spotlight-Homepage/content-queue.json';
      var MAX_ACTIVE_ITEMS = 3;
      var HIGH_PRIORITY_TAG = 'high priority';
      
      var contentData = [];
      
      // Load content from JSON file
      function loadContent() {
        if (typeof fetch === 'undefined') {
          console.error('VPM Spotlight: fetch API not available');
          showError('Unable to load content. Your browser does not support this feature.');
          return;
        }
        
        fetch(GITHUB_JSON_URL)
          .then(function(response) {
            if (!response.ok) {
              throw new Error('Failed to load content queue');
            }
            return response.json();
          })
          .then(function(data) {
            contentData = data.items || [];
            renderCards();
          })
          .catch(function(error) {
            console.error('Error loading content:', error);
            showError('Unable to load content. Please check the GitHub JSON URL configuration.');
          });
      }
      
      function showError(message) {
        var container = document.getElementById('vpm-spotlight-cards');
        if (container) {
          container.innerHTML = '<p style="color: var(--vpm-color-text-muted, #666666); padding: var(--vpm-spacing-lg, 2rem);">' + message + '</p>';
        }
      }
      
      // Get active items (tagged with "high priority")
      function getActiveItems() {
        return contentData
          .filter(function(item) {
            return item.tags && item.tags.includes(HIGH_PRIORITY_TAG);
          })
          .sort(function(a, b) {
            return new Date(b.dateAdded) - new Date(a.dateAdded);
          })
          .slice(0, MAX_ACTIVE_ITEMS);
      }
      
      // Render cards to the DOM
      function renderCards() {
        var container = document.getElementById('vpm-spotlight-cards');
        if (!container) {
          return;
        }
        
        var activeItems = getActiveItems();
        
        // Clear container
        container.innerHTML = '';
        
        if (activeItems.length === 0) {
          container.innerHTML = '<p style="color: var(--vpm-color-text-muted, #666666); padding: var(--vpm-spacing-lg, 2rem);">No content items are currently active. Add items with the "high priority" tag to display them.</p>';
          return;
        }
        
        // Create and append cards
        activeItems.forEach(function(item) {
          var card = createCardElement(item);
          container.appendChild(card);
        });
      }
      
      // Create a card element
      function createCardElement(item) {
        var card = document.createElement('div');
        card.className = 'vpm-spotlight-card';
        card.setAttribute('data-id', item.id);
        
        var link = document.createElement('a');
        link.href = item.link || '#';
        link.className = 'vpm-spotlight-card-link';
        link.setAttribute('aria-label', 'Read more about ' + (item.title || 'content'));
        
        var image = document.createElement('img');
        image.src = item.picture || '';
        image.alt = item.title || 'Content image';
        image.className = 'vpm-spotlight-card-image';
        image.loading = 'lazy';
        
        var content = document.createElement('div');
        content.className = 'vpm-spotlight-card-content';
        
        var title = document.createElement('h3');
        title.className = 'vpm-spotlight-card-title';
        title.textContent = item.title || '';
        
        var subtitle = document.createElement('p');
        subtitle.className = 'vpm-spotlight-card-subtitle';
        subtitle.textContent = item.subtitle || '';
        
        var description = document.createElement('p');
        description.className = 'vpm-spotlight-card-description';
        description.textContent = item.description || '';
        
        content.appendChild(title);
        content.appendChild(subtitle);
        content.appendChild(description);
        
        link.appendChild(image);
        link.appendChild(content);
        card.appendChild(link);
        
        return card;
      }
      
      // Initialize on page load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadContent);
      } else {
        loadContent();
      }
    })();
  </script>
</body>
</html>
