          }

            display: none;
          }

                <div class="vpm-impact-testimonials__video-track">

                <div class="vpm-impact-testimonials__nav-dots">

    initComponent(shadow) {
      const root = shadow.host;
      let currentVideoIndex = 0;
      let currentQuoteIndex = 0;
      let videoInterval;
      let quoteInterval;
      
      const videoTrack = shadow.querySelector('.vpm-impact-testimonials__video-track');
      const videoDots = shadow.querySelectorAll('.vpm-impact-testimonials__card:first-child .vpm-impact-testimonials__nav-dot');
      const videoTitle = shadow.querySelector('.vpm-impact-testimonials__card:first-child .vpm-impact-testimonials__current-title');
      const videoSubtitle = shadow.querySelector('.vpm-impact-testimonials__card:first-child .vpm-impact-testimonials__current-subtitle');
      const quoteTrack = shadow.querySelector('.vpm-impact-testimonials__quote-track');
      const quoteDots = shadow.querySelectorAll('.vpm-impact-testimonials__card:last-child .vpm-impact-testimonials__nav-dot');
      const quoteTitle = shadow.querySelector('.vpm-impact-testimonials__card:last-child .vpm-impact-testimonials__current-title');
      const quoteSubtitle = shadow.querySelector('.vpm-impact-testimonials__card:last-child .vpm-impact-testimonials__current-subtitle');
      
      const videoData = [
        { title: "Nupa Agarwal", subtitle: "Community Impact Story" },
        { title: "Ebony Walden", subtitle: "Educational Transformation" },
        { title: "Boz Boschen", subtitle: "Local News Trust" }
      ];
      
      const quoteData = [
        { title: "Dawn D.", subtitle: '"I love VPM, PBS and NPR..."' },
        { title: "Jennifer T.", subtitle: '"I look to VPM for balanced news..."' },
        { title: "Rob W.", subtitle: '"VPM provides fact-based programming..."' },
        { title: "Sylvia C.", subtitle: '"VPM offers quality programs..."' }
      ];
      
      function showVideo(index) {
        if (index < 0 || index >= videoData.length) return;
        currentVideoIndex = index;
        if (videoTrack) videoTrack.style.transform = 'translateX(' + (-index * 100) + '%)';
        videoDots.forEach(function(dot, i) {
          dot.classList.toggle('vpm-impact-testimonials__nav-dot--active', i === index);
        });
        if (videoTitle) videoTitle.textContent = videoData[index].title;
        if (videoSubtitle) videoSubtitle.textContent = videoData[index].subtitle;
      }
      
      function nextVideo() {
        currentVideoIndex = (currentVideoIndex + 1) % videoData.length;
        showVideo(currentVideoIndex);
      }
      
      function prevVideo() {
        currentVideoIndex = (currentVideoIndex - 1 + videoData.length) % videoData.length;
        showVideo(currentVideoIndex);
      }
      
      function showQuote(index) {
        if (index < 0 || index >= quoteData.length) return;
        currentQuoteIndex = index;
        if (quoteTrack) quoteTrack.style.transform = 'translateX(' + (-index * 100) + '%)';
        quoteDots.forEach(function(dot, i) {
          dot.classList.toggle('vpm-impact-testimonials__nav-dot--active', i === index);
        });
        if (quoteTitle) quoteTitle.textContent = quoteData[index].title;
        if (quoteSubtitle) quoteSubtitle.textContent = quoteData[index].subtitle;
      }
      
      function nextQuote() {
        currentQuoteIndex = (currentQuoteIndex + 1) % quoteData.length;
        showQuote(currentQuoteIndex);
      }
      
      function prevQuote() {
        currentQuoteIndex = (currentQuoteIndex - 1 + quoteData.length) % quoteData.length;
        showQuote(currentQuoteIndex);
      }
      
      function startVideoAutoAdvance() {
        if (videoInterval) clearInterval(videoInterval);
        videoInterval = setInterval(nextVideo, 8000);
      }
      
      function stopVideoAutoAdvance() {
        if (videoInterval) {
          clearInterval(videoInterval);
          videoInterval = null;
        }
      }
      
      function startQuoteAutoAdvance() {
        if (quoteInterval) clearInterval(quoteInterval);
        quoteInterval = setInterval(nextQuote, 7000);
      }
      
      function stopQuoteAutoAdvance() {
        if (quoteInterval) {
          clearInterval(quoteInterval);
          quoteInterval = null;
        }
      }
      
      // Event listeners
      const videoPrevBtn = shadow.querySelector('.vpm-impact-testimonials__card:first-child .vpm-impact-testimonials__nav-arrow--prev');
      const videoNextBtn = shadow.querySelector('.vpm-impact-testimonials__card:first-child .vpm-impact-testimonials__nav-arrow--next');
      const quotePrevBtn = shadow.querySelector('.vpm-impact-testimonials__card:last-child .vpm-impact-testimonials__nav-arrow--prev');
      const quoteNextBtn = shadow.querySelector('.vpm-impact-testimonials__card:last-child .vpm-impact-testimonials__nav-arrow--next');
      const videoCard = shadow.querySelector('.vpm-impact-testimonials__card:first-child');
      const quoteCard = shadow.querySelector('.vpm-impact-testimonials__card:last-child');
      const quoteItems = shadow.querySelectorAll('.vpm-impact-testimonials__quote-item');
      
      if (videoPrevBtn) videoPrevBtn.addEventListener('click', prevVideo);
      if (videoNextBtn) videoNextBtn.addEventListener('click', nextVideo);
      if (quotePrevBtn) quotePrevBtn.addEventListener('click', prevQuote);
      if (quoteNextBtn) quoteNextBtn.addEventListener('click', nextQuote);
      
      videoDots.forEach(function(dot, index) {
        dot.addEventListener('click', function() { showVideo(index); });
      });
      
      quoteDots.forEach(function(dot, index) {
        dot.addEventListener('click', function() { showQuote(index); });
      });
      
      quoteItems.forEach(function(item, index) {
        item.addEventListener('click', function() {
          showQuote(index);
        });
        item.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            showQuote(index);
          }
        });
      });
      
      if (videoCard) {
        videoCard.addEventListener('mouseenter', stopVideoAutoAdvance);
        videoCard.addEventListener('mouseleave', startVideoAutoAdvance);
      }
      
      if (quoteCard) {
        quoteCard.addEventListener('mouseenter', stopQuoteAutoAdvance);
        quoteCard.addEventListener('mouseleave', startQuoteAutoAdvance);
      }
      
      // Touch/swipe support
      let touchStartX = 0;
      let touchEndX = 0;
      
      root.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      
      root.addEventListener('touchend', function(e) {
        touchEndX = e.changedTouches[0].screenX;
        const swipeThreshold = 50;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > swipeThreshold) {
          const target = document.elementFromPoint(touchStartX, 0);
          if (!target) return;
          if (videoCard && videoCard.contains(target)) {
            if (diff > 0) nextVideo(); else prevVideo();
          } else if (quoteCard && quoteCard.contains(target)) {
            if (diff > 0) nextQuote(); else prevQuote();
          }
        }
      }, { passive: true });
      
      startVideoAutoAdvance();
      startQuoteAutoAdvance();
    }
  }
  
  customElements.define('vpm-impact-testimonials', VPMImpactTestimonials);
})();
</script>
